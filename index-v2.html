<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="canonical" href="./">
<title>Growing Season</title>
<script>
// The app used to live at this filename and moved to the site root. This stub
// keeps older links and home-screen bookmarks working, and forwards the query
// string and hash so an auth link's recovery token survives the hop.
(function(){
  location.replace('./'+(location.search||'')+(location.hash||''));
})();
</script>
</head>
<body>
<p style="font-family:system-ui,sans-serif;text-align:center;padding:40px 20px;color:#555;">
  Growing Season has moved — <a id="go" href="./">continue here</a>.
</p>
<script>
(function(){
  var a=document.getElementById('go');
  if(a)a.href='./'+(location.search||'')+(location.hash||'');
})();
</script>
</body>
</html>
